<!doctype html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <!-- jubayer.bond/books — a short, shareable link to the Books section.
       It has its own preview (title, text, cover) for Facebook, Messenger, WhatsApp…,
       then sends the visitor to the Books section of the main page.
       Extra parts are kept: /books#buy/book-1 opens that book's order form. -->
  <title>Bookstore — Books by Jubayer</title>
  <meta name="description" content="Books by Jubayer. Order “তুমি আমি আর কিছু নামহীন চিঠি” with bKash or cash on delivery. Free delivery at BRAC University." />
  <link rel="canonical" href="https://jubayer.bond/books" />
  <meta property="og:type" content="website" />

  <script>
    (function () {
      var h = location.hash && location.hash.length > 1 ? location.hash : "#books";
      location.replace("/" + location.search + h);
    })();

  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#05060f;color:#e8eaf3;font-family:Inter,system-ui,sans-serif;text-align:center}
